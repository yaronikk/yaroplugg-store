name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/auth-marketplace-account]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Report runtime versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Commit generated lockfile if it is not tracked yet
        if: github.event_name == 'push' && hashFiles('package-lock.json') != ''
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify locked dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Typecheck and build
        run: npm run build
