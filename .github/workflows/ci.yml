name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/auth-marketplace-account]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Typecheck and build
        run: npm run build
